## RabiitMQ (cues)
spring.rabbitmq.host=monitoringsvr.ames
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=_r4bb1tMqS3rv3r_
# Mode transaccional automàtic: Només s'envia ACK quan s'ha fet commit a la BBDD
spring.rabbitmq.listener.simple.acknowledge-mode=AUTO
spring.rabbitmq.listener.simple.transactional=true
# Política de reintents d'entrega del missatge
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=60000
# Permetre que si el missatge falla es reencui i no es perdi evitant
# també l'encuament a una cua de missatges morts (DLQ)
spring.rabbitmq.listener.simple.default-requeue-rejected=true

## Cues de missatges
cua.entrades=q.gp.lliuraments.transferencia.backup

