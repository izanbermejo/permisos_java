## Port de comunicació
server.port = 3535

## Application path (tots els enpoints comencen per permisos)
spring.jersey.application-path = permisos

## Evita que s'executi el reload d'Spring dos vegades després de guardar canvis
spring.devtools.restart.poll-interval=3000
spring.devtools.restart.quiet-period=2000

## Màxim tamany del header (per defecte en Jetty 8KB)
server.max-http-header-size = 1MB

## Configuració de l'Advantage (la BBDD testdbfs es copia cada nit amb les dades de producció)
advantage.path = //pingu.ames:6262;catalog=//pingu.ames/home/testdbfs/com/comdb.add
advantage.pathmag = //pingu.ames:6262;catalog=//pingu.ames/home/testdbfs/mag/magdb.add

## Esperem 5 segons a que s'acabin de processar les peticions pendents abans d'apagar el servidor
server.shutdown = graceful
spring.lifecycle.timeout-per-shutdown-phase = 5s

docsapps-folder = /home/docsapps

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

## Log4j
logging.file.name=logs/app.log
logging.file.path=logs
logging.level.ames.permisos=TRACE
logging.level.root=INFO
logging.file.max-size=1MB

